name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lint-only job, deliberately not installing requirements.txt: ruff is a
      # standalone static-analysis tool that needs no runtime dependencies to
      # check syntax/style, and this project's requirements.txt is unusually
      # heavy (pulls in stray CUDA packages as transitive deps of chromadb/
      # gradio, despite Ollama inference running on a separate machine) --
      # installing it just to run a linter would make this job slow and
      # fragile for no benefit.
      - run: pip install ruff==0.16.0
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same reasoning as the lint job: install the minimal test-only
      # dependency set (requirements-dev.txt), NOT the full runtime stack. The
      # tests/ suite exercises this project's pure-logic modules (risk table,
      # scope parser, eligibility filter, payload loader, approval batcher, and
      # the subprocess runner's result contract) -- none of which need the LLM,
      # ChromaDB, Gradio, or the external security-tool binaries, so none of
      # those are installed here.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
